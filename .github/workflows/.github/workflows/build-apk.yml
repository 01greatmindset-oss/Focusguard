name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate app directory
        id: locate
        run: |
          if [ -f "app.json" ]; then
            echo "app_dir=." >> $GITHUB_OUTPUT
          elif [ -f "focusguard/app.json" ]; then
            echo "app_dir=focusguard" >> $GITHUB_OUTPUT
          else
            echo "app_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npm install

      - name: Generate Android project & build APK
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          npx expo prebuild --platform android --non-interactive
          cd android
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-APK
          path: ${{ steps.locate.outputs.app_dir }}/android/app/build/outputs/apk/**/*.apk
